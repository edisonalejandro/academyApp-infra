version: "3.9"

services:
  api:
    image: ${REGISTRY}/academyapp-api:${IMAGE_TAG}
    container_name: academyapp_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@cache:6379
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - academy_network
    # NOTE: The `deploy` section is only honoured by Docker Swarm (docker stack deploy).
    # If using plain `docker compose up`, remove this section and scale via --scale flag.
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  frontend:
    image: ${REGISTRY}/academyapp-frontend:${IMAGE_TAG}
    container_name: academyapp_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - academy_network

  db:
    image: postgres:15-alpine
    container_name: academyapp_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - academy_network

  cache:
    image: redis:7-alpine
    container_name: academyapp_cache
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - academy_network

volumes:
  postgres_data:
  redis_data:

networks:
  academy_network:
    driver: bridge
